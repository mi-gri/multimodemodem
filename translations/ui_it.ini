text.enable_auto_mode_ft8_ft4_auto_qso_js8_automatic_operation=Attiva la modalità automatica (Auto QSO FT8/FT4, funzionamento automatico JS8)
text.lets_auto_qso_answer_cq_calls_and_complete_qsos_and_js8_answer_queries_relay_messages_and_=Permette ad Auto QSO di rispondere ai CQ e completare i QSO, e a JS8 di rispondere alle richieste, inoltrare messaggi e inviare heartbeat o CQ a intervalli. All’attivazione compare un avviso legale e di sicurezza da confermare.
text.ft8_ft4_late_decodes=Decodifiche tardive FT8 / FT4
text.keep_searching_after_the_reply_deadline_and_show_late_decodes=Continua a cercare dopo il termine per la risposta e mostra le decodifiche tardive
text.the_deep_search_goes_on_for_up_to_9_s_ft4_4_5_s_into_the_next_period_late_decodes_are_only=La ricerca approfondita continua fino a 9 s (FT4 4,5 s) nel periodo successivo. Le decodifiche tardive sono solo mostrate: non rispondono, non chiamano e non avviano la TX. In quel tempo usa circa due core della CPU.
text.rx_drift_compensation=Compensazione drift RX
text.try_gpu_drift_sync_experimental_automatic_cpu_fallback=Prova GPU per il drift (sperimentale, ritorno automatico alla CPU)
text.requires_an_opencl_gpu_with_double_precision_the_first_batch_checks_cpu_parity_and_total_t=Richiede una GPU OpenCL con doppia precisione. Il primo blocco confronta risultati e tempo totale con la CPU; se la GPU è più lenta o dà errori, resta attiva la CPU. Vale per il recupero drift da 144 MHz.
text.recover_drifting_signals_near_the_rx_marker_experimental=Recupera segnali con drift vicino al marcatore RX (sperimentale)
text.maximum_drift=Drift massimo (±)
text.select_the_signal_with_the_rx_marker_this_option_helps_decode_it_when_its_frequency_change=Posiziona il marcatore RX sul segnale da seguire. Questa opzione aiuta a decodificarlo se la frequenza cambia durante la ricezione. La frequenza TX resta quella impostata. I risultati compaiono nel registro.
text.active_only_at_144_mhz_and_above_up_to_20_hz_s_uses_cat_frequency_or_the_selected_band_wit=Attivo solo da 144 MHz in su, fino a ±20 Hz/s. Usa la frequenza CAT oppure la banda selezionata senza CAT. Mantieni tutto il segnale in deriva dentro la banda passante del ricevitore.
