text.abort_the_active_image_transmission_and_release_rts_ptt=Abort the active image transmission and release RTS PTT.
text.audio_mark_tone_in_hz_high_tone_afsk_commonly_uses_2125_hz_low_tone_afsk_often_uses_1275_h=Audio mark tone in Hz. High-tone AFSK commonly uses 2125 Hz; low-tone AFSK often uses 1275 Hz. Waterfall click tuning sets this marker for the current session.
text.automatically_save_a_completed_wefax_frame_as_png_using_weatherfax_yyyymmdd_hhmmss_png_in_=Automatically save a completed WEFAX frame as PNG using WeatherFAX_YYYYMMDD_HHMMSS.png in the selected folder.
text.crt_style_rtty_mark_space_tuning_scope_it_shows_only_the_live_tuning_trace_and_the_logical=CRT-style RTTY Mark/Space tuning scope. It shows only the live tuning trace and the logical Mark/Space labels; decoded text belongs to the terminal or optional waterfall overlay.
text.center_frequency_of_the_mfsk_tone_set_click_the_waterfall_to_retune_it_directly=Center frequency of the MFSK tone set. Click the waterfall to retune it directly.
text.clear_only_rx_a_text_and_reset_rx_a_acquisition_rx_b_keeps_running=Clear only RX A text and reset RX A acquisition; RX B keeps running.
text.clear_only_rx_b_text_and_reset_rx_b_acquisition_rx_a_keeps_running=Clear only RX B text and reset RX B acquisition; RX A keeps running.
