text.clear_the_rtty_transmission_text=Clear the RTTY transmission text.
text.clear_the_current_meteofax_image_and_restart_the_decoder_start_stop_state_machine=Clear the current MeteoFax image and restart the decoder start/stop state machine.
text.clear_the_received_mfsk_text_window=Clear the received MFSK text window.
text.clear_the_received_psk_text_window=Clear the received PSK text window.
text.clear_the_received_rtty_text_window=Clear the received RTTY text window.
text.compatibility_ptt_serial_selector_prefer_settings_audio_ptt_settings_or_cat_rig_for_normal=Compatibility PTT serial selector. Prefer Settings > Audio / PTT settings or CAT / Rig for normal configuration.
text.compatibility_device_selector_the_real_audio_ptt_setup_is_in_settings_audio_ptt_settings_t=Compatibility device selector. The real audio/PTT setup is in Settings > Audio / PTT settings; this field mirrors saved devices for older layouts.
text.compatibility_stop_control_kept_hidden_the_status_rx_button_now_toggles_live_rx=Compatibility stop control kept hidden; the Status RX button now toggles live RX.
text.complete_and_optionally_auto_save_the_frame_when_the_decoder_sees_an_apt_stop_end_tone_or_=Complete and optionally auto-save the frame when the decoder sees an APT stop/end tone or when the useful WEFAX signal disappears for the timeout.
text.current_decoder_state_and_diagnostic_text_from_the_selected_modem=Current decoder state and diagnostic text from the selected modem.
text.current_input_audio_level_keep_it_safely_below_clipping_while_still_high_enough_for_reliab=Current input audio level. Keep it safely below clipping while still high enough for reliable decoding.
text.decode_a_wav_recording_directly_through_the_meteofax_dsp_path_without_playing_it_to_speake=Decode a WAV recording directly through the MeteoFax DSP path without playing it to speakers. WAV analysis uses manual/free-running timing from the first sample, then locks the first stable WEFAX sync stripe before showing/saving rows.
text.decoded_morse_text_from_the_exact_blue_rx_b_receiver=Decoded Morse text from the exact blue RX B receiver.
text.decoded_morse_text_from_the_exact_green_rx_a_receiver=Decoded Morse text from the exact green RX A receiver.
text.decoded_psk_text_using_the_varicode_pipeline=Decoded PSK text using the Varicode pipeline.
text.decoded_rtty_text_uses_ita2_baudot_letters_figures_shift=Decoded RTTY text. Uses ITA2/Baudot letters/figures shift.
text.dominant_audio_frequency_estimated_by_the_common_dsp_engine_and_shown_on_the_waterfall=Dominant audio frequency estimated by the common DSP engine and shown on the waterfall.
text.edit_the_label_and_transmitted_text_of_the_active_rtty_macro_bank=Edit the label and transmitted text of the active RTTY macro bank.
text.enable_narrow_afc_around_the_hellschreiber_center_marker_the_paper_follows_the_strongest_l=Enable narrow AFC around the Hellschreiber center marker. The paper follows the strongest local keyed-tone energy peak.
text.enable_narrow_afc_around_the_selected_psk_tone_useful_for_small_audio_radio_drift_disable_=Enable narrow AFC around the selected PSK tone. Useful for small audio/radio drift; disable for exact loopback tests.
text.enable_slow_afc_on_the_mfsk_tone_bank_to_follow_small_audio_frequency_offsets=Enable slow AFC on the MFSK tone bank to follow small audio-frequency offsets.
text.end_of_signal_timeout_in_seconds_increase_it_for_noisy_hf_channels_decrease_it_for_faster_=End-of-signal timeout in seconds. Increase it for noisy HF channels; decrease it for faster unattended saving after the control/end tone or signal loss.
text.folder_used_for_automatic_png_saving_the_folder_is_created_automatically_if_it_does_not_ex=Folder used for automatic PNG saving. The folder is created automatically if it does not exist.
text.frequency_shift_between_mark_and_space_tones_common_amateur_narrow_shift_is_170_hz_utility=Frequency shift between mark and space tones. Common amateur narrow shift is 170 Hz; utility modes often use 425 or 850 Hz.
text.hellschreiber_center_carrier_tone_in_hz_click_the_waterfall_to_retune_this_session_only_ma=Hellschreiber center carrier tone in Hz. Click the waterfall to retune this session-only marker directly.
text.image_transmission_progress_the_shaded_area_on_the_preview_shows_pixels_lines_already_tran=Image transmission progress. The shaded area on the preview shows pixels/lines already transmitted.
text.image_zoom_controls_mouse_wheel_zooms_over_the_image_drag_pans_when_zoomed_in=Image zoom controls. Mouse wheel zooms over the image; drag pans when zoomed in.
text.internal_safety_maximum_only_the_received_image_grows_line_by_line_and_no_artificial_image=Internal safety maximum only. The received image grows line by line and no artificial image buffer is shown.
text.invert_decoded_transmitted_bits_for_diagnostics_normally_leave_off_for_standard_psk=Invert decoded/transmitted bits for diagnostics. Normally leave OFF for standard PSK.
text.invert_mark_space_logic_enable_when_decoded_text_is_garbage_but_the_signal_is_otherwise_st=Invert mark/space logic. Enable when decoded text is garbage but the signal is otherwise strong and centered.
text.load_a_still_image_for_tx_supported_formats_depend_on_qt_image_plugins_typically_png_jpeg_=Load a still image for TX. Supported formats depend on Qt image plugins, typically PNG, JPEG/JPG and BMP.
text.load_plain_text_for_hellschreiber_transmission=Load plain text for Hellschreiber transmission.
text.load_plain_text_for_mfsk_transmission=Load plain text for MFSK transmission.
text.load_plain_text_for_psk_transmission=Load plain text for PSK transmission.
text.load_plain_text_for_rtty_transmission=Load plain text for RTTY transmission.
text.maximum_afc_search_window_around_each_rtty_marker_start_with_20_hz_use_smaller_values_for_=Maximum AFC search window around each RTTY marker. Start with ±20 Hz; use smaller values for crowded contest bands.
text.maximum_afc_search_window_around_the_hellschreiber_marker_10_to_20_hz_is_a_good_starting_p=Maximum AFC search window around the Hellschreiber marker. ±10 to ±20 Hz is a good starting point.
text.maximum_afc_search_window_around_the_psk_marker_start_with_20_hz_use_smaller_values_in_cro=Maximum AFC search window around the PSK marker. Start with ±20 Hz; use smaller values in crowded bands.
text.maximum_mfsk_tone_bank_afc_correction_range_around_the_selected_center_frequency=Maximum MFSK tone-bank AFC correction range around the selected center frequency.
text.maximum_number_of_parallel_rtty_shadow_decoders_lower_this_on_older_pcs=Maximum number of parallel RTTY shadow decoders. Lower this on older PCs.
text.narrow_dual_channel_rtty_filter_keeps_only_tight_bands_around_mark_and_space_and_strongly_=Narrow dual-channel RTTY filter. Keeps only tight bands around Mark and Space and strongly rejects signals outside and between the two tones. Useful on crowded contest bands.
text.psk_audio_carrier_tone_1000_hz_is_a_safe_default_for_sound_card_testing_center_the_signal_=PSK audio carrier tone. 1000 Hz is a safe default for sound-card testing; center the signal on this marker in the waterfall.
text.paper_speed_hellschreiber_column_rate_use_this_if_received_letters_look_horizontally_compr=Paper speed / Hellschreiber column rate. Use this if received letters look horizontally compressed or stretched. Standard Feld Hell and FSK-105 use 17.5 columns per second.
text.pulse_the_configured_rts_ptt_serial_line_for_a_short_hardware_test_from_settings_diagnosti=Pulse the configured RTS PTT serial line for a short hardware test from Settings/diagnostics.
text.rms_input_level_in_dbfs_very_low_values_indicate_no_audio_or_wrong_input_device=RMS input level in dBFS. Very low values indicate no audio or wrong input device.
text.rtty_symbol_rate_common_amateur_value_is_45_45_baud_50_75_and_100_baud_are_also_available_=RTTY symbol rate. Common amateur value is 45.45 baud; 50, 75 and 100 baud are also available for compatibility tests.
text.rx_mode_and_receiver_filter_width_marks_a_hamlib_value_that_may_be_nominal_multimodemodem_=Modo RX e larghezza del filtro della radio. ~ indica un valore Hamlib che può essere nominale. MultiModeModem trasmette RTTY e CW tramite audio; la manipolazione FSK/CW nativa è una funzione separata della radio.
text.rx_tone_detector_bandwidth_for_the_visual_hell_paper_fsk_105_uses_two_tones_around_the_cen=RX tone detector bandwidth for the visual Hell paper. FSK-105 uses two tones around the center marker.
text.received_mfsk_text_mfsk16_uses_standard_varicode_fec_mfsk32_remains_experimental=Received MFSK text. MFSK16 uses standard Varicode/FEC; MFSK32 remains experimental.
text.refresh_visible_audio_and_serial_device_lists_after_plugging_unplugging_usb_sound_cards_or=Refresh visible audio and serial device lists after plugging/unplugging USB sound cards or radio interfaces.
text.removed_in_v45_v46_slant_correction_is_disabled_to_preserve_the_stable_wefax_line_timing_p=Removed in v45/v46: slant correction is disabled to preserve the stable WEFAX line timing path.
text.run_lightweight_parallel_rtty_shadow_decoders_over_the_waterfall_while_the_main_terminal_r=Run lightweight parallel RTTY shadow decoders over the waterfall while the main terminal remains tuned to the selected signal.
text.runtime_status_log_use_the_dedicated_runtime_log_button_for_longer_cat_ft_diagnostics_when=Runtime status log. Use the dedicated runtime log button for longer CAT/FT diagnostics when debugging timing or PTT issues.
text.save_the_currently_displayed_meteofax_image_as_a_png_file_selected_manually=Save the currently displayed MeteoFax image as a PNG file selected manually.
text.select_bpsk_qpsk_symbol_rate_higher_rates_need_stronger_cleaner_and_wider_signals_qpsk_var=Select BPSK/QPSK symbol rate. Higher rates need stronger, cleaner and wider signals; QPSK variants in this build are experimental.
text.select_a_common_rtty_baud_shift_tone_preset_use_custom_for_manual_values=Select a common RTTY baud/shift/tone preset. Use Custom for manual values.
text.select_a_station_example_the_entry_sets_practical_wefax_defaults_and_shows_example_rf_freq=Select a station example. The entry sets practical WEFAX defaults and shows example RF frequencies in the tooltip/status text.
text.select_classic_keyed_amplitude_feld_hell_or_two_tone_fsk_105_hellschreiber=Select classic keyed-amplitude Feld Hell or two-tone FSK-105 Hellschreiber.
text.select_standard_mfsk16_varicode_fec_or_legacy_experimental_mfsk32=Select standard MFSK16 Varicode/FEC or legacy experimental MFSK32.
text.show_the_selected_rtty_decoder_text_vertically_between_the_mark_and_space_tones_on_the_wat=Show the selected RTTY decoder text vertically between the Mark and Space tones on the waterfall. Disable it for an unobstructed spectrum.
text.text_to_transmit_as_bpsk_qpsk_the_transmitter_uses_varicode_and_shaped_phase_changes=Text to transmit as BPSK/QPSK. The transmitter uses Varicode and shaped phase changes.
text.text_to_transmit_as_cw_unsupported_characters_are_skipped_or_converted_to_spacing=Text to transmit as CW. Unsupported characters are skipped or converted to spacing.
text.text_to_transmit_as_hellschreiber_local_tx_is_printed_in_red_on_the_same_paper_tape=Text to transmit as Hellschreiber. Local TX is printed in red on the same paper tape.
text.text_to_transmit_as_ita2_baudot_afsk_rtty_unsupported_characters_are_converted_to_spaces=Text to transmit as ITA2/Baudot AFSK RTTY. Unsupported characters are converted to spaces.
text.text_to_transmit_mfsk16_uses_standard_varicode_fec_mfsk32_uses_the_legacy_experimental_pat=Text to transmit. MFSK16 uses standard Varicode/FEC; MFSK32 uses the legacy experimental path.
text.track_a_common_rx_offset_around_the_rtty_markers_afc_preserves_the_selected_shift_and_neve=Track a common RX offset around the RTTY markers. AFC preserves the selected shift and never changes the TX tones.
text.transmit_the_cw_text_typed_in_the_input_box=Transmit the CW text typed in the input box.
text.transmit_the_hellschreiber_text_typed_in_the_input_box=Trasmette il testo Hellschreiber inserito nel campo.
text.transmit_the_mfsk_text_typed_in_the_input_box=Transmit the MFSK text typed in the input box.
text.transmit_the_loaded_image_using_the_active_mode_settings_waterfall_shows_the_generated_tx_=Transmit the loaded image using the active mode settings. Waterfall shows the generated TX audio; the image overlay shows transmitted rows.
text.stop_the_current_rtty_transmission=Stop the current RTTY transmission.
text.stop_the_current_psk_transmission=Stop the current PSK transmission.
