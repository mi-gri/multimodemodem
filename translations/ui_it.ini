text.try_gpu_ft8_ft4_decoding_experimental_all_bands=Prova decodifica FT8/FT4 con GPU (sperimentale, tutte le bande)
text.offloads_symbol_tone_energies_to_opencl_fp64_checks_cpu_parity_and_total_time_with_automat=Calcola le energie dei toni dei simboli con OpenCL FP64. Confronta risultati e tempo totale con la CPU e torna automaticamente alla CPU se necessario. Indipendente dalla compensazione drift.
