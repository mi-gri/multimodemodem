cw_key_help=Il KEY seriale richiede la radio in CW e un’interfaccia collegata all’ingresso KEY. Seleziona la porta COM virtuale e la linea assegnata: il numero della COM non ne definisce la funzione. Senza una linea PTT, abilita il BK-IN sulla radio. Il CW audio usa SSB/Data e le normali impostazioni Audio/PTT.
cw_key_cat_share=Se KEY condivide la porta seriale CAT, MM chiude temporaneamente la CAT, manipola il messaggio e riconnette la CAT dopo il rilascio delle linee. Imposta il controllo di flusso CAT su Nessuno e forza entrambe le linee a OFF. Una porta KEY separata mantiene disponibile la CAT durante il TX. I tempi dipendono da USB e sistema operativo: questo metodo non è un WinKeyer hardware e non garantisce il full QSK.
