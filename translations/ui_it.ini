cw_audio_tx_method=TX: CW audio tramite SSB/Data
cw_serial_tx_explanation=Punti e linee usano la linea KEY RTS/DTR selezionata. Imposta la radio in CW. Il BK-IN della radio gestisce il TX, oppure l’altra linea seriale opzionale fornisce il PTT. La forzatura del modo CAT Audio/PTT viene esclusa. La condivisione della porta CAT sospende la CAT durante il messaggio.
cw_audio_tx_explanation=MM genera il Morse come tono audio tramite l’ingresso SSB/Data della radio. La CAT usa il modo TX audio configurato. Per manipolare l’ingresso CW della radio seleziona KEY seriale nelle impostazioni Trasmissione CW.
cw_key_port_required=Scegli una porta seriale locale per CW KEY. Un indirizzo CAT TCP non è una porta KEY.
cw_key_shared_config=La condivisione della porta CAT per CW KEY richiede controllo di flusso CAT Nessuno ed entrambe le linee DTR e RTS forzate a OFF nelle impostazioni Audio/PTT/CAT. In alternativa scegli la porta KEY separata della radio.
cw_key_rotator_conflict=La porta CW KEY è assegnata al rotore. Scegli una porta seriale diversa.
cw_key_handoff_failed=La CAT non ha potuto rilasciare la porta CW KEY; trasmissione annullata.
cw_key_cat_restore_failed=CW KEY si è fermato, ma la riconnessione CAT non è riuscita. Controlla il collegamento CAT.
cw_key_release_failed=Il rilascio CW KEY/PTT non è stato confermato. TX bloccato. Ricollega l’interfaccia e premi Stop per ritentare il rilascio delle linee.
