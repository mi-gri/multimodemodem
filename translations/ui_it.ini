cw_key_invalid=Seleziona una porta KEY seriale e usa linee diverse per KEY e PTT.
text.working_frequencies_per_mode_and_band_as_in_wsjt_x_jtdx_band_selectors_mode_changes_and_th=Frequenze di lavoro per modo e banda, come in WSJT-X/JTDX. Selettori di banda, cambi di modo e scheduler usano la frequenza preferita della banda; se manca, la prima voce. Le frequenze sono frequenze di sintonia in MHz (USB, SSTV su 80/40 m LSB).
