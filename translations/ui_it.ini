text.only_checked_qsos_will_be_exported_missing_or_invalid_data_is_shown_for_each_row_and_block=Saranno esportati solo i QSO spuntati. I dati mancanti o non validi sono segnalati su ogni riga e bloccano l’esportazione: correggerli nel logbook oppure escludere esplicitamente la riga. Il logbook non viene modificato.
