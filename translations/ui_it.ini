text.editions_found_in_the_complete_logbook_independent_of_the_current_search_filter_dates_are_=Edizioni presenti nell’intero logbook, indipendentemente dal filtro di ricerca corrente. Le date sono UTC; i nominativi di stazione diversi restano separati.
text.no_contest_editions_found_records_need_a_contest_identifier_or_rule_and_a_valid_utc_date_u=Nessuna edizione trovata. Occorrono un identificativo o profilo contest e una data UTC valida. I QSO senza identificativo vengono riconosciuti solo quando date, modo e scambi registrati individuano una sola edizione.
text.sessions_from_the_same_edition_are_combined_for_every_contest_recognition_uses_logged_cont=Le sessioni della stessa edizione vengono riunite per ogni contest. Il riconoscimento usa gli identificativi e i profili registrati, i periodi disponibili e gli scambi. I QSO riconosciuti senza identificativo sono segnalati nell’anteprima; quelli ambigui non vengono assegnati automaticamente.
text.not_selected_1_records_without_a_valid_utc_date_2_outside_known_contest_periods_3_with_amb=Non selezionati: %1 QSO senza data UTC valida; %2 fuori dai periodi noti del contest; %3 con attribuzione al contest ambigua.
