tooltip.image_tx_group=Carica un’immagine PNG/JPEG/BMP, visualizza l’anteprima adattata a WEFAX o SSTV e trasmettila come audio generato.
tooltip.compat_audio_output=Selettore uscita compatibilità. Usa Impostazioni > Audio / PTT per scegliere il dispositivo audio TX usato da modi testuali, SSTV/WEFAX e FT Tune.
tooltip.waterfall_widget=Waterfall audio live. Clicca su un segnale per sintonizzare il marker del modo attivo. In FT4/FT8 il verde è RX e il rosso è TX; in CW il clic sinistro imposta RX A, il destro RX B e sinistro+destro insieme impostano il tono TX rosso.
tooltip.image_preview=Anteprima immagine decodificata WEFAX/SSTV. La rotella zooma; trascina per spostare quando sei in zoom.
tooltip.wefax_black_tone=Frequenza del tono nero in Hz. In HF WEFAX è tipicamente circa 1500 Hz; il tracking automatico può rifinirla durante la ricezione.
tooltip.wefax_white_tone=Frequenza del tono bianco in Hz. In HF WEFAX è tipicamente circa 2300 Hz; il decoder mappa il range nero-bianco in scala di grigi.
tooltip.wefax_apt_start=Abilita il riconoscimento automatico dell’avvio APT WEFAX e la fasatura iniziale. Disabilitalo per test manuali/free-run.
tooltip.wefax_auto_tones=Abilita il tracking AFC della coppia di toni nero/bianco. I due marker si muovono insieme ignorando periodi start/sync.
tooltip.wefax_bandpass=Applica un passa-banda solo decoder intorno al range dei toni nero/bianco per respingere rumore fuori banda utile.
tooltip.sstv_mode=Seleziona il modo SSTV manuale. Sono supportate famiglie Martin, Scottie, Robot e PD in RX/TX; Robot/PD usano temporizzazioni YUV classiche.
tooltip.sstv_auto_sync=Aggancia ogni riga SSTV usando l’impulso di sync orizzontale a 1200 Hz. Disabilitalo solo per test controllati con timing stabile.
sstv_adjust_phase_help=Sposta orizzontalmente tutte le righe ricevute, anche a immagine completa. I valori positivi spostano a destra. Tornando a zero si ripristina la fase originale.
sstv_adjust_red_help=Allinea il rosso rispetto al verde su tutta l’immagine ricevuta. Tornando a zero si ripristina il canale rosso originale.
sstv_adjust_blue_help=Allinea il blu rispetto al verde su tutta l’immagine ricevuta. Tornando a zero si ripristina il canale blu originale.
tooltip.sstv_analyze_wav=Decodifica una registrazione WAV SSTV direttamente nel decoder attivo senza riprodurla sugli altoparlanti.
tooltip.sstv_reset_image=Cancella l’immagine SSTV corrente e riavvia il decoder SSTV selezionato.
tooltip.sstv_save_png=Salva l’immagine SSTV visualizzata come PNG scelto manualmente.
cw_tone_help=Marcatore CW verde RX A. Fare clic sinistro sul waterfall per spostarlo sul segnale da decodificare.
cw_tx_tone_help=Marcatore rosso della nota audio TX CW. Modifica questo valore oppure premi insieme clic sinistro+destro sulla waterfall per spostare la nota realmente trasmessa.
cw_wpm_help=Indicazione manuale dei WPM RX usata quando Auto WPM è disattivato. L’intervallo visualizzato RX è da 5 a 50 WPM.
cw_auto_wpm_help=Stima continuamente la velocità Morse. Il campo della velocità viene usato come valore iniziale finché non sono disponibili dati temporali sufficienti.
cw_tx_wpm_help=Velocità di trasmissione CW, indipendente dalle stime automatiche di RX A e RX B.
cw_bandwidth_help=Selettività CW richiesta per RX A/RX B. L’acquisizione in frequenza resta più larga, mentre il ramo temporale applica automaticamente la banda minima necessaria in base ai WPM tracciati, così una regolazione stretta non cancella i punti.
cw_auto_bandwidth_help=Sceglie separatamente la selettività di RX A e RX B in base a WPM, qualità di aggancio e portanti vicine.
cw_afc_help=Segue piccoli scostamenti e derive del tono in modo indipendente per RX A e RX B senza spostare i marcatori dell’operatore.
cw_afc_range_help=Correzione AFC interna massima attorno a ciascun marcatore CW. Nelle bande affollate usare un intervallo ridotto per non seguire una stazione adiacente.
cw_rx_a_help=Testo Morse decodificato dal ricevitore esatto RX A, associato al marcatore verde.
cw_rx_b_help=Testo Morse decodificato dal ricevitore esatto RX B, associato al marcatore blu.
cw_tx_help=Testo da trasmettere in CW. I caratteri non supportati vengono ignorati o convertiti in spazi.
cw_send_help=Trasmette il testo CW oppure ferma la trasmissione in corso.
cw_clear_rx_a_help=Cancella solo il testo RX A e reimposta l’acquisizione RX A; RX B continua a funzionare.
cw_clear_rx_b_help=Cancella solo il testo RX B e reimposta l’acquisizione RX B; RX A continua a funzionare.
