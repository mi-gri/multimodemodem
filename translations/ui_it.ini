text.exchanges_follow_each_contest_profile_using_recorded_internal_fields_standard_adif_fields_=Gli scambi seguono il profilo di ogni contest, usando i campi interni registrati, i campi ADIF standard e gli scambi testuali. Se necessario è possibile selezionare manualmente i campi ADIF. La categoria di banda non elimina i QSO sulle altre bande.
